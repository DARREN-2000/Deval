name: release

# Tag-driven release: v0.7.0 -> PyPI + GHCR + a GitHub Release.
# Nothing here runs on ordinary pushes, so a normal merge can never publish.
# Deliberately tag-only. A manual run would set GITHUB_REF_NAME to a branch
# name, so the tag/version equality check below could never pass. Use the
# publish-pypi workflow for manual or TestPyPI publishing instead.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # Gate the release on the same checks main is held to. A tag must never
  # publish something that would fail CI.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Python 3.11+ is required for the `tomllib` import used to read package version.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest -q
      - name: Deval self-scan (must stay clean to ship)
        run: deval scan . --min-score 100
      - name: Tag must match package version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(python -c "import tomllib,pathlib;print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          echo "tag=$TAG package=$PKG"
          test "$TAG" = "$PKG" || { echo "::error::Tag $TAG does not match pyproject version $PKG"; exit 1; }

  build:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write      # required to sign the provenance statement
      attestations: write  # required to record it against the repository
    steps:
      - uses: actions/checkout@v7
      # Python 3.11+ is required for the `tomllib` import used to read package version.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Build sdist and wheel
        run: |
          pip install --upgrade build twine
          python -m build
      - name: Check package metadata
        run: twine check dist/*
      # We use /tmp/smoke (outside the repository directory) so that Deval's 
      # scan of '.' doesn't inspect the temporary virtual environment.
      - name: Verify the wheel installs and runs clean
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install dist/*.whl
          /tmp/smoke/bin/deval --version
          /tmp/smoke/bin/deval scan . --min-score 100
      - name: Attest build provenance for the distributions
        # Lets a consumer verify these exact files were built by this workflow
        # from this commit, rather than uploaded with a compromised token:
        #   gh attestation verify deval-0.7.0-py3-none-any.whl --repo DARREN-2000/deval
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: "dist/*"
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/deval
    permissions:
      id-token: write  # OIDC trusted publishing: no API token stored in the repo
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  docker:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - name: Build and push
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  github-release:
    needs: [build, pypi, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - name: Extract this version's changelog section
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" {flag=1; next}
            flag && /^## \[/ {exit}
            flag {print}
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "No changelog entry found for $VERSION." > release-notes.md
          fi
          cat release-notes.md
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          body_path: release-notes.md
          files: dist/*
          generate_release_notes: true
