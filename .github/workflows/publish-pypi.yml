name: publish-pypi

# Standalone, manually-triggered publish to TestPyPI or PyPI.
#
# `release.yml` already publishes to PyPI automatically when you push a `v*`
# tag, and that remains the normal path. This workflow exists for the cases a
# tag cannot cover:
#
#   * rehearsing the very first upload on TestPyPI, where a mistake is
#     recoverable -- a real PyPI upload can never be replaced, only yanked;
#   * re-running a publish when the tag build succeeded but the upload step
#     failed (an expired trusted-publisher config, a PyPI outage);
#   * confirming the name is claimable before committing to a public launch.
#
# It never fires on its own: it must be started from the Actions tab.

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Where to publish"
        required: true
        default: testpypi
        type: choice
        options: [testpypi, pypi]
      ref:
        description: "Tag, branch, or SHA to publish from (defaults to the current branch)"
        required: false
        type: string
      skip_existing:
        description: "Skip files already present on the index instead of failing"
        required: false
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  build:
    name: Build and verify artifacts
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      # Python 3.11+ is required for the `tomllib` import below used to parse pyproject.toml.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Publishing something that would fail CI is never acceptable, even from
      # a manual run. These are the same gates release.yml applies.
      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest -q

      - name: Deval self-scan (must stay clean to ship)
        run: deval scan . --min-score 100

      - name: Read package version
        id: version
        run: |
          PKG=$(python -c "import tomllib,pathlib;print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          echo "version=$PKG" >> "$GITHUB_OUTPUT"
          echo "Publishing version $PKG to ${{ inputs.target }}"

      - name: Build sdist and wheel
        run: |
          pip install --upgrade build twine
          python -m build

      - name: Check package metadata renders on PyPI
        run: twine check --strict dist/*

      # Catch the classic packaging mistakes before they reach an index:
      # a wheel that ships tests, or one missing the package itself.
      - name: Inspect artifact contents
        run: |
          set -e
          echo "--- dist ---"; ls -la dist/
          echo "--- wheel contents ---"
          python -m zipfile -l dist/*.whl
          if python -m zipfile -l dist/*.whl | grep -qE '^\s*tests/'; then
            echo "::error::The wheel contains the tests package."; exit 1
          fi
          if ! python -m zipfile -l dist/*.whl | grep -q 'deval/__init__.py'; then
            echo "::error::The wheel does not contain the deval package."; exit 1
          fi

      # Verify the wheel installs and runs in a clean environment.
      # We use /tmp/smoke (outside the repository directory) so that Deval's 
      # scan of '.' doesn't inspect the temporary virtual environment.
      - name: Verify the wheel installs and runs in a clean environment
        run: |
          set -e
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install --upgrade pip
          /tmp/smoke/bin/pip install dist/*.whl
          /tmp/smoke/bin/deval --version
          # Deval declares zero runtime dependencies; prove the install honoured that.
          INSTALLED=$(/tmp/smoke/bin/pip list --format=freeze | grep -viE '^(pip|setuptools|wheel)==' | grep -vi '^deval==' | wc -l)
          if [ "$INSTALLED" -ne 0 ]; then
            echo "::error::Installing deval pulled in unexpected dependencies:"
            /tmp/smoke/bin/pip list --format=freeze
            exit 1
          fi
          /tmp/smoke/bin/deval scan . --min-score 100

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  testpypi:
    name: Publish to TestPyPI
    if: inputs.target == 'testpypi'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/deval
    permissions:
      id-token: write  # OIDC trusted publishing -- no API token stored in the repo
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: ${{ inputs.skip_existing }}
          print-hash: true

      - name: How to verify this upload
        run: |
          echo "Install from TestPyPI, taking dependencies from real PyPI:"
          echo "  pip install --index-url https://test.pypi.org/simple/ \\"
          echo "    --extra-index-url https://pypi.org/simple deval==${{ needs.build.outputs.version }}"

  pypi:
    name: Publish to PyPI
    if: inputs.target == 'pypi'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/deval
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      # A real PyPI upload is permanent. Requiring the `pypi` environment means
      # this step waits for whatever reviewers you configure on it.
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: ${{ inputs.skip_existing }}
          print-hash: true

      - name: Confirm
        run: |
          echo "Published deval ${{ needs.build.outputs.version }} to PyPI."
          echo "  pip install deval==${{ needs.build.outputs.version }}"
